[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "parametric_dr"
version = "3.0.0"
description = "Multi-method parametric dimensionality reduction (t-SNE, PaCMAP, UMAP, TriMap, CEBRA) using PyTorch."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name="Jacob Silterra", email="parametric@jacobsilterra.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "numpy",
    "scikit-learn",
    "scipy",
    "torch",
]

[project.optional-dependencies]
viz = ["matplotlib", "seaborn"]
test = ["pytest"]

[project.urls]
"Homepage" = "https://github.com/jsilter/parametric_dr"

[tool.setuptools]
packages = ["parametric_dr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
